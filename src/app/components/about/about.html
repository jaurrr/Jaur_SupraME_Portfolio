<section id="about" class="panel" appPanel>
  <div class="wipe" aria-hidden="true"></div>

  <div class="section-head" appReveal>
    <span class="section-num">01</span>
    <h2>About</h2>
    <span class="label">Who I am</span>
  </div>

  <div class="about-grid">
    <figure class="plate" appReveal>
      <div class="plate-frame imgwipe">
        <img [src]="about.image" alt="Portrait of Jauhar Ayyub outdoors" loading="lazy" />
      </div>
      <figcaption><span class="cap-num">Pl. II</span> Notes from the workshop.</figcaption>
    </figure>

    <div class="about-copy">
      @for (p of about.paragraphs; track $index) {
        <p appReveal [appReveal]="80 + $index * 60">{{ p }}</p>
      }
      <div class="stats" appReveal="200">
        @for (s of about.stats; track s.label) {
          <div class="stat">
            <span class="stat-value" #statVal [attr.data-raw]="s.value">{{ s.value }}</span>
            <span class="stat-label">{{ s.label }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</section>
