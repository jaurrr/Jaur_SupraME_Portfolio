@if (visible()) {
  <div class="preloader" [class.exit]="phase() !== 'counting'" [class.gone]="phase() === 'gone'" aria-hidden="true">
    <div class="pre-center">
      <p class="pre-label">Jaur — welcome to my portfolio</p>
      <p class="pre-count" aria-hidden="true">{{ count() }}</p>
      <div class="pre-bar"><span [style.width.%]="progress()"></span></div>
      <p class="pre-status">{{ status() }}</p>
    </div>
    <div class="pre-wipe" aria-hidden="true"></div>
  </div>
}
